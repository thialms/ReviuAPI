<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Swagger</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh; margin: 0; display: grid; place-items: center;
            background: #f3f6f9;
        }
        .login-card {
            width: min(360px, calc(100% - 40px)); padding: 32px;
            box-sizing: border-box; border-radius: 10px; background: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        h1 { margin: 0 0 24px; font-size: 24px; color: #1b1b1b; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input {
            width: 100%; height: 42px; margin-bottom: 18px; padding: 0 12px;
            box-sizing: border-box; border: 1px solid #bcc5cf;
            border-radius: 6px; font-size: 16px;
        }
        button {
            width: 100%; height: 44px; border: 0; border-radius: 6px;
            background: #49cc90; color: #fff; font-size: 16px;
            font-weight: 700; cursor: pointer;
        }
        button:hover { background: #38b879; }
        .error { display: none; margin: 0 0 18px; color: #b42318; }
    </style>
</head>
<body>
<main class="login-card">
    <h1>Acesso ao Swagger</h1>
    <p id="error" class="error">Usuario ou senha invalidos.</p>
    <form method="post" action="/swagger-login">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Entrar</button>
    </form>
</main>
<script>
    if (new URLSearchParams(window.location.search).has("error")) {
        document.getElementById("error").style.display = "block";
    }
</script>
</body>
</html>
