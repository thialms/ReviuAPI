spring.application.name=reviu

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# O schema passa a ser criado e evoluído por migrations do Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Em bancos existentes, registra a versão inicial sem tentar recriar as tabelas.
# Em bancos vazios, o Flyway executa V1 normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

api.security.token.secret=${SECRET_KEY_TOKEN}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL}
spring.mail.password=${EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}

gemini.api.key=${GEMINI_API_KEY}
